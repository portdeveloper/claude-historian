name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build darwin-arm64
        run: bun build src/index.tsx --compile --target=bun-darwin-arm64 --outfile=claude-historian-darwin-arm64

      - name: Build darwin-x64
        run: bun build src/index.tsx --compile --target=bun-darwin-x64 --outfile=claude-historian-darwin-x64

      - name: Upload darwin-arm64
        uses: actions/upload-artifact@v4
        with:
          name: claude-historian-darwin-arm64
          path: claude-historian-darwin-arm64

      - name: Upload darwin-x64
        uses: actions/upload-artifact@v4
        with:
          name: claude-historian-darwin-x64
          path: claude-historian-darwin-x64

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build linux-x64
        run: bun build src/index.tsx --compile --target=bun-linux-x64 --outfile=claude-historian-linux-x64

      - name: Build linux-arm64
        run: bun build src/index.tsx --compile --target=bun-linux-arm64 --outfile=claude-historian-linux-arm64

      - name: Upload linux-x64
        uses: actions/upload-artifact@v4
        with:
          name: claude-historian-linux-x64
          path: claude-historian-linux-x64

      - name: Upload linux-arm64
        uses: actions/upload-artifact@v4
        with:
          name: claude-historian-linux-arm64
          path: claude-historian-linux-arm64

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            cp "$dir"* "release/$name"
            chmod +x "release/$name"
          done
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true
          draft: false
